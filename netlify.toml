[build]
  publish = "."

[[redirects]]
  from = "/api/queue-times/:id"
  to = "https://queue-times.com/parks/:id/queue_times.json"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
